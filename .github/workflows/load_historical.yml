name: SAPTA Load Historical Data (one-off)

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'base (2 anni, tutto l''universo), extended (storico esteso, 18 ticker stress test) o indices (solo ^GSPC/FTSEMIB.MI, per Relative Strength)'
        required: true
        type: choice
        options:
          - base
          - extended
          - indices
        default: base

jobs:
  load-historical:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements-slow.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --retries 5 --timeout 60 -r requirements-slow.txt

      - name: Run load_historical_data.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python src/load_historical_data.py --scope=${{ inputs.scope }}
