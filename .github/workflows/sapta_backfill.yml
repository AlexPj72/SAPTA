name: SAPTA Backfill quotazioni (manuale)

on:
  workflow_dispatch:
    inputs:
      period:
        description: 'Periodo 15m da recuperare (max 60d su Yahoo), es. 5d'
        default: '5d'

jobs:
  backfill:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements-fast.txt
      - run: pip install --retries 5 --timeout 60 -r requirements-fast.txt
      - name: Quotazioni 15m (Modulo A, periodo esteso)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          A_PERIOD: ${{ github.event.inputs.period || '5d' }}
        run: python src/modulo_a_ingestion.py
      - name: Quotazioni giornaliere (ultimi 5 giorni)
        if: ${{ !cancelled() }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python src/update_daily_prices.py
