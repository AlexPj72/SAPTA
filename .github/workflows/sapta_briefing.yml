name: SAPTA Briefing Pre-Apertura (1x/day)

on:
  schedule:
    # 06:00 UTC: prima dell'apertura di Borsa Italiana (07:00/08:00 UTC a
    # seconda di ora legale/solare) e ben prima dell'apertura USA. Un solo
    # briefing giornaliero copre l'intero universo (IT+USA) - i titoli USA
    # restano validi come "da osservare in giornata", non solo per l'apertura.
    - cron: '0 6 * * 1-5'
  workflow_dispatch:

concurrency:
  group: sapta-briefing
  cancel-in-progress: true

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements-slow.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-slow.txt

      - name: Run Modulo Briefing - Shortlist pre-apertura
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/modulo_briefing.py
