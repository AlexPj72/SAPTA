name: SAPTA Cleanup Old Intraday Data

on:
  schedule:
    # [NUOVO 28/09] Una volta al giorno, 20:00 UTC (dopo la chiusura USA).
    # Prima questo step viveva dentro sapta_fast.yml con una condizione
    # (github.event.schedule == '0 20 * * *') che non poteva MAI essere
    # vera, perché l'unico cron di quel workflow è '*/15 9-17 * * 1-5':
    # il cleanup non è mai partito una sola volta da quando esiste SAPTA.
    # In più, src/cleanup_old_data.py non esisteva proprio nel repo -
    # anche azzeccando la condizione, il passo sarebbe comunque fallito.
    # Workflow separato con cron dedicato: nessuna ambiguità possibile.
    - cron: '0 20 * * 1-5'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements-fast.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --retries 5 --timeout 60 -r requirements-fast.txt

      - name: Run cleanup - pruning dati intraday 15m più vecchi di 14gg
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python src/cleanup_old_data.py
