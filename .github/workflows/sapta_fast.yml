name: SAPTA Fast Pipeline (Ingestion + Anomaly Scanner)

on:
  schedule:
    # Ogni 15 minuti, 9-17 UTC, Lun-Ven
    # Nota: copre bene Milano; il mercato USA chiude più tardi (13:30/14:30-20:00/21:00 UTC
    # a seconda dell'ora legale) e resta parzialmente scoperto — estendi l'intervallo
    # (es. "9-20") se vuoi coprire anche la chiusura USA, tenendo conto dell'impatto sui minuti.
    - cron: '*/15 7-21 * * 1-5'
  workflow_dispatch:

concurrency:
  group: sapta-fast
  cancel-in-progress: true  # evita run sovrapposti se uno impiega più del previsto

jobs:
  ingestion-and-anomaly:
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements-fast.txt

      - name: Install dependencies (leggere, nessuna libreria ML)
        run: |
          python -m pip install --upgrade pip
          pip install --retries 5 --timeout 60 -r requirements-fast.txt

      - name: Run Modulo A - Data Ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: python src/modulo_a_ingestion.py

      - name: Run Modulo H - Screening (H1)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python src/modulo_h_anomaly.py --stage=h1

      - name: Run Modulo AI Watch - Ipotesi qualitative + alert (NUOVO 18/09)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python src/modulo_ai_watch.py

      - name: Run Modulo T - State machine operativa (PAPER, alert COMPRA ORA e VENDI ORA, nessuna operazione di portafoglio)
        if: ${{ !cancelled() }}   # parte anche se AI Watch esce con errore (es. SMTP)
        continue-on-error: true   # un problema di T non deve mai bloccare ingestione, H1 o AI Watch
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python src/modulo_t_state_machine.py
