name: SAPTA Fast Pipeline (Ingestion + Anomaly Scanner)

on:
  schedule:
    # Ogni 15 minuti, 9-17 UTC, Lun-Ven
    # Nota: copre bene Milano; il mercato USA chiude più tardi (13:30/14:30-20:00/21:00 UTC
    # a seconda dell'ora legale) e resta parzialmente scoperto — estendi l'intervallo
    # (es. "9-20") se vuoi coprire anche la chiusura USA, tenendo conto dell'impatto sui minuti.
    - cron: '*/15 9-17 * * 1-5'
  workflow_dispatch:

concurrency:
  group: sapta-fast
  cancel-in-progress: true  # evita run sovrapposti se uno impiega più del previsto

jobs:
  ingestion-and-anomaly:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements-fast.txt

      - name: Install dependencies (leggere, nessuna libreria ML)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-fast.txt

      - name: Run Modulo A - Data Ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: python src/modulo_a_ingestion.py

      - name: Run Modulo H - Anomaly Scanner
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python src/modulo_h_anomaly.py

      - name: Cleanup old intraday data (pruning, una volta al giorno)
        if: github.event.schedule == '0 20 * * *'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python src/cleanup_old_data.py
