name: SAPTA Fast Pipeline (Ingestion + Anomaly Scanner)

on:
  # Avvio solo da cron-job.org (workflow_dispatch, ogni 15 min). Rimosso il 'schedule' nativo il 27/11: ritardi di ore, run fuori orario e cancellazioni da concurrency.
  workflow_dispatch:

concurrency:
  group: sapta-fast
  cancel-in-progress: true  # evita run sovrapposti se uno impiega più del previsto

jobs:
  ingestion-and-anomaly:
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements-fast.txt

      - name: Install dependencies (leggere, nessuna libreria ML)
        run: |
          python -m pip install --upgrade pip
          pip install --retries 5 --timeout 60 -r requirements-fast.txt

      - name: Run Modulo A - Data Ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: python src/modulo_a_ingestion.py

      - name: Run Modulo H - Screening (H1)
        if: ${{ !cancelled() }}   # [Passo 1] parte anche se A esce con errore: l'errore di A resta visibile (job rosso), H1 non salta in silenzio
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python src/modulo_h_anomaly.py --stage=h1

      - name: Run Modulo H - Contesto e promozione (H2, subito dopo H1)
        if: ${{ !cancelled() }}   # [Passo 3] H2 parte subito dopo H1 nello stesso ciclo: i candidati appena creati non aspettano il giro Slow (errore di H2 visibile, catena non interrotta)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python src/modulo_h_anomaly.py --stage=h2

      - name: Run Modulo AI Watch - Ipotesi qualitative + alert (NUOVO 18/09)
        if: ${{ !cancelled() }}   # [Passo 1] idem: AI Watch non salta se A fallisce (la freschezza delle barre e' controllata in lettura)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python src/modulo_ai_watch.py

      - name: Run Modulo T - State machine operativa (PAPER, alert COMPRA ORA e VENDI ORA, nessuna operazione di portafoglio)
        if: ${{ !cancelled() }}   # parte anche se AI Watch esce con errore (es. SMTP)
        # [24/11] niente continue-on-error: un errore di T rende ROSSO il job (prima restava 'success' e nascondeva run in ERROR).
        # Gli step successivi hanno if: !cancelled(), quindi nulla viene bloccato.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python src/modulo_t_state_machine.py

      - name: Avvisi sulle posizioni dell'utente (perdita eccessiva, discesa anomala; solo avvisi, PAPER)
        if: ${{ !cancelled() }}
        continue-on-error: true   # non deve mai bloccare la pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python src/modulo_alert_posizioni_utente.py

      - name: Confronto parallelo stop fisso / stop dinamico (PAPER, solo calcolo)
        if: ${{ !cancelled() }}
        continue-on-error: true   # non deve mai bloccare la pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python src/modulo_confronto_stop.py --salva
