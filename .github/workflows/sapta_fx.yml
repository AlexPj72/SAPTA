name: SAPTA FX (tassi di riferimento BCE)

# Carica il tasso BCE EUR/USD in fx_rates. La BCE pubblica verso le 16:00 CET nei giorni lavorativi TARGET:
# due esecuzioni (16:30 e 21:00 UTC) per sicurezza; l'inserimento e' idempotente (un tasso per giornata, mai modificato).
on:
  schedule:
    - cron: '30 16 * * 1-5'
    - cron: '0 21 * * 1-5'
  workflow_dispatch:
    inputs:
      hist90:
        description: "Scarica gli ultimi ~90 giorni (primo caricamento o recupero)"
        type: boolean
        default: false

jobs:
  load-fx:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --retries 5 --timeout 60 -r requirements-fast.txt
      - name: Carica tassi BCE
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python src/load_fx_rates.py ${{ github.event.inputs.hist90 == 'true' && '--hist90' || '' }}
