name: SAPTA Report portafoglio IA (settimanale)

on:
  schedule:
    - cron: '45 21 * * 5'   # venerdi' 21:45 UTC: dopo la chiusura USA sia con ora legale (20:00) sia solare (21:00)
  workflow_dispatch:
    inputs:
      days:
        description: 'Giorni da riassumere'
        default: '7'

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements-fast.txt
      - run: pip install --retries 5 --timeout 60 -r requirements-fast.txt
      - name: Report
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python src/modulo_report_ia.py --days "${{ github.event.inputs.days || '7' }}"
