name: SAPTA Slow Pipeline (Analysis + Cost Filter)

on:
  schedule:
    - cron: '0,30 7-21 * * 1-5'  # ogni 30 minuti, 7-21 UTC, Lun-Ven (copre anche la chiusura USA in ora solare)
  workflow_dispatch:

concurrency:
  group: sapta-slow
  cancel-in-progress: true

jobs:
  analysis-and-cost-filter:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements-slow.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --retries 5 --timeout 60 -r requirements-slow.txt

      - name: Run Modulo H - Anomaly + Context (H2)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python src/modulo_h_anomaly.py --stage=h2

      - name: Run Modulo B - Analysis & Signals (sentiment via HF Inference API)
        if: ${{ !cancelled() }}  # B parte anche se H2 fallisce (come prima: B non dipendeva da H2)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/modulo_b_analysis.py

      - name: Run Modulo E - Cost Filter
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python src/modulo_e_cost_filter.py
