name: SAPTA US Close Pipeline (Segnale USA finalizzato, 1x/day)

on:
  schedule:
    # 21:30 UTC: margine di sicurezza sopra la chiusura NYSE/NASDAQ sia in DST (20:00 UTC)
    # che in orario solare (21:00 UTC) — non serve un cron stagionale diverso.
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

concurrency:
  group: sapta-us-close
  cancel-in-progress: true

jobs:
  us-close-signal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements-slow.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --retries 5 --timeout 60 -r requirements-slow.txt

      - name: Update Daily Prices - aggiornamento incrementale 1d (NUOVO 22/09 - fix audit)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python src/update_daily_prices.py

      - name: Run Modulo EOD Verify - Verifica esiti reali AI Watch (NUOVO 19/09)
        if: ${{ !cancelled() }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python src/modulo_eod_verify.py

      - name: Run Modulo Experimental Rule - regola sperimentale non operativa (NUOVO 20/09)
        if: ${{ !cancelled() }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python src/modulo_experimental_rule.py

      - name: Run Modulo B - Analysis & Signals (solo USA, barra ormai finalizzata)
        if: ${{ !cancelled() }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/modulo_b_analysis.py --market=USA --force-reprocess

      - name: Run Modulo E - Cost Filter (solo USA)
        if: ${{ !cancelled() }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python src/modulo_e_cost_filter.py --market=USA

      - name: Run Modulo Rimbalzo - paper USA / osservazione EU (NUOVO 20/10, non bloccante)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python src/modulo_rimbalzo.py

      - name: Aggiorna storico esiti segnali - solo osservazione (NUOVO 20/10, non bloccante)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python src/aggiorna_signal_outcomes.py
