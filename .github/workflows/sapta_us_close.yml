name: SAPTA US Close Pipeline (Segnale USA finalizzato, 1x/day)

on:
  schedule:
    # 21:30 UTC: margine di sicurezza sopra la chiusura NYSE/NASDAQ sia in DST (20:00 UTC)
    # che in orario solare (21:00 UTC) — non serve un cron stagionale diverso.
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

concurrency:
  group: sapta-us-close
  cancel-in-progress: true

jobs:
  us-close-signal:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements-slow.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-slow.txt

      - name: Run Modulo B - Analysis & Signals (solo USA, barra ormai finalizzata)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python src/modulo_b_analysis.py --market=USA --force-reprocess

      - name: Run Modulo E - Cost Filter (solo USA)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python src/modulo_e_cost_filter.py --market=USA
