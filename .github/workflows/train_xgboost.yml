name: SAPTA Train XGBoost (one-off, manuale)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install --retries 5 --timeout 60 -r requirements-slow.txt

      - name: Run training
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python src/train_xgboost_model.py

      - name: Commit modello e report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/ XGBOOST_TRAINING_REPORT.md
          git diff --staged --quiet || git commit -m "Training XGBoost: aggiorna modello e report ($(date -u +%Y-%m-%d))"
          git push
